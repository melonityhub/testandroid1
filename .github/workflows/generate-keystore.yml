name: Generate signing keystore (run once)

# Creates a permanent signing key so every future APK can be installed over the previous one.
# The result is downloadable ONLY from this run's Artifacts (by repository collaborators) and expires after 1 day.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore and secrets file
        run: |
          mkdir -p out
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -v -keystore out/release.jks -alias proudvocab -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=ProudVocab, O=ProudVocab, C=US" > /dev/null 2>&1
          B64="$(base64 -w0 out/release.jks)"
          {
            echo "Add these 4 repository secrets (Settings > Secrets and variables > Actions > New repository secret):"
            echo
            echo "KEY_ALIAS=proudvocab"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64=$B64"
            echo
            echo "KEEP release.jks SAFE (back it up). If you lose it you cannot update the app in place any more."
            echo "Then delete this workflow run's artifact."
          } > out/secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-and-secrets
          path: out/
          retention-days: 1
